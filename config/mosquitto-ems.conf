# Local-only broker for the EMS and web backend processes.
#
# Security: the listener is deliberately bound to the loopback address.
# allow_anonymous is only acceptable because nothing outside this host can
# reach 127.0.0.1. Never change this listener to 0.0.0.0 (or add another
# non-loopback listener) while anonymous access is allowed: anyone able to
# reach the port could publish to <base-topic>/command and drive the
# southbound devices through EMS. To expose the broker beyond this host,
# set allow_anonymous false, add a password_file (mosquitto_passwd) and
# restrict <base-topic> traffic with ACLs to the EMS and web backend clients.
listener 1883 127.0.0.1
allow_anonymous true

# Persist retained telemetry/status and QoS 1 in-flight commands so a broker
# restart does not drop them. persistence_location is resolved against the
# broker working directory and must end with '/'; the directory has to exist
# (the repository ships data/mosquitto/.gitkeep). Start the broker from the
# project root, or replace this with an absolute path such as
# /var/lib/mosquitto/ when installing it as a systemd service.
persistence true
persistence_location data/mosquitto/
autosave_interval 60
